{% extends 'core/dashboard/dashboard_base.html' %}

{% block dashboard_content %}
<div class="admin-header">
    <h1>{{ title }}</h1>
    <a href="javascript:history.back()" class="btn btn-outline btn-small"><i class="fas fa-arrow-left"></i> Back</a>
</div>

<div class="glass-card" style="padding: 2rem; max-width: 800px;">
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        
        {% for field in form %}
            <div class="form-group" style="margin-bottom: 2rem;">
                <label class="glass-label">{{ field.label }}</label>
                {{ field }}
                {% if field.help_text %}
                    <small style="color: var(--text-muted); display: block; margin-top: 0.5rem;">{{ field.help_text }}</small>
                {% endif %}
                {% if field.errors %}
                    <div style="color: #ef4444; margin-top: 0.5rem;">
                        {{ field.errors }}
                    </div>
                {% endif %}
            </div>
        {% endfor %}
        
        <div style="margin-top: 3rem; display: flex; gap: 1rem;">
            <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Save Changes</button>
            <a href="javascript:history.back()" class="btn btn-outline">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
